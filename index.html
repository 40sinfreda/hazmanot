<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="כלבו ווט">
  <title>הזמנות כלבו ווט</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="theme.css?v=23">
</head>
<body>
  <div id="splash">
    <img class="splash-logo" src="logo.png" alt="כלבו ווט">
    <div class="splash-title">הזמנות סוכנים</div>
    <div class="bar"><div id="bar-fill"></div></div>
    <div id="splash-msg">טוען נתונים...</div>
    <button type="button" id="install-btn" class="mobile-only">התקן את האפליקציה</button>
    <button type="button" id="skip-install" class="mobile-only">המשך בלי התקנה</button>
    <div id="ios-hint" class="mobile-only">באייפון: שתף ← הוסף למסך הבית</div>
  </div>
  <div class="header">
    <img class="hdr-logo" src="logo.png" alt="כלבו ווט">
    <div>
      <h1>הזמנות סוכנים</h1>
      <div class="sub" id="home-meta">טוען...</div>
    </div>
  </div>
  <div id="screen-home" class="screen active">
    <input class="search" id="home-search" placeholder="חיפוש לקוח" oninput="renderHome()">
    <div class="chips">
      <button type="button" class="on" data-f="open" onclick="setHomeFilter('open')">פתוחות</button>
      <button type="button" data-f="draft" onclick="setHomeFilter('draft')">טיוטה</button>
      <button type="button" data-f="ready" onclick="setHomeFilter('ready')">מוכנה</button>
      <button type="button" data-f="all" onclick="setHomeFilter('all')">הכל</button>
      <button type="button" onclick="load()">רענון</button>
    </div>
    <div id="home-list"><div class="card empty">טוען נתונים...</div></div>
  </div>
  <div id="screen-new" class="screen">
    <div class="card">
      <label>לקוח</label>
      <div id="picked-cust" class="picked">לא נבחר לקוח</div>
      <input class="search" id="cust-search" placeholder="הקלד שם לקוח" oninput="filterCustomers()">
      <div id="cust-results" class="results"></div>
      <label>סוכן</label>
      <select id="agent"></select>
      <label>תאריך אספקה</label>
      <input type="date" id="delivery">
      <label>מי מספק</label>
      <select id="supplier"></select>
    </div>
    <div class="card">
      <div>שורות</div>
      <div id="lines"></div>
      <label>מוצר</label>
      <div id="picked-prod" class="picked">לא נבחר מוצר</div>
      <input class="search" id="prod-search" placeholder="הקלד שם מוצר" oninput="filterProducts()">
      <div id="prod-results" class="results"></div>
      <label>כמות</label>
      <input id="qty" type="number" min="1" value="1">
      <div id="stock-hint" class="fab-note"></div>
      <button type="button" class="btn btn-outline" onclick="addLine()">הוסף שורה</button>
    </div>
    <button type="button" class="btn btn-primary" onclick="saveOrder()">שמור הזמנה</button>
  </div>
  <div id="screen-detail" class="screen">
    <div class="card" id="detail"></div>
    <button type="button" class="btn btn-primary" onclick="setStatus('מוכנה')">סמן מוכנה</button>
    <button type="button" class="btn btn-accent" onclick="setStatus('סופקה')">סמן סופקה</button>
    <button type="button" class="btn btn-outline" onclick="showScreen('home')">חזרה</button>
  </div>
  <div class="toast" id="toast"></div>
  <nav class="nav">
    <button type="button" class="active" data-s="home" onclick="showScreen('home')">ראשי</button>
    <button type="button" data-s="new" onclick="showScreen('new')">הזמנה חדשה</button>
  </nav>
  <script src="config.js?v=23"></script>
  <script src="app.js?v=23"></script>
</body>
</html>
