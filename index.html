<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="כלבו ווט">
  <title>הזמנות כלבו ווט</title>
  <link rel="manifest" href="manifest.json?v=34">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
  <link rel="stylesheet" href="theme.css?v=34">
  <style>
    .step{display:none}
    .step.on{display:block}
    #save-wait{position:fixed;inset:0;background:rgba(255,255,255,.96);z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
    #save-wait.show{display:flex}
    #save-wait .bar{width:min(70vw,280px);height:6px;background:#e6efe9;border-radius:99px;overflow:hidden;margin-top:16px}
    #save-fill{height:100%;width:12%;background:#3d8f6e;transition:width .3s}
    #save-wait-msg{margin-top:12px;font-size:1.05rem;font-weight:700;color:#16352b}
    .cust-link{color:#0f3d2e;text-decoration:underline;cursor:pointer}
    #cust-card{position:fixed;inset:0;background:rgba(22,53,43,.45);z-index:70;display:none;align-items:flex-end;justify-content:center}
    #cust-card.show{display:flex}
    #cust-card .sheet{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
    #cust-card h2{margin:0 0 12px;font-size:1.1rem}
    .cust-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #e2ddd4;font-size:.95rem}
    .cust-row span{color:#5c6b64}
    .cust-row a{color:#0f3d2e}
    .contact-row{display:flex;gap:8px;margin:6px 0}
    .contact-row input{flex:1}
    #settings-tabs{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
    #settings-tabs button{flex:1}
    #date-hint{font-size:.8rem;color:#5c6b64;margin-top:4px}
  </style>
</head>
<body>
  <div id="splash">
    <img class="splash-logo" src="logo.png" alt="כלבו ווט">
    <div class="splash-title">הזמנות סוכנים</div>
    <div class="bar"><div id="bar-fill"></div></div>
    <div id="splash-msg">טוען נתונים...</div>
    <button type="button" id="install-btn" class="mobile-only">התקן את האפליקציה</button>
    <button type="button" id="skip-install" class="mobile-only">המשך בלי התקנה</button>
    <div id="ios-hint" class="mobile-only">באייפון: שתף ← הוסף למסך הבית</div>
  </div>
  <div id="save-wait">
    <img class="splash-logo" src="logo.png" alt="" style="width:140px">
    <div id="save-wait-msg">ההזמנה נשמרת</div>
    <div class="bar"><div id="save-fill"></div></div>
  </div>
  <div id="cust-card">
    <div class="sheet">
      <div id="cust-card-body"></div>
      <button type="button" class="btn btn-primary" id="cust-card-close">סגור</button>
    </div>
  </div>
  <div class="header">
    <img class="hdr-logo" src="logo.png" alt="כלבו ווט">
    <div>
      <h1>הזמנות סוכנים</h1>
      <div class="sub" id="home-meta">טוען...</div>
    </div>
  </div>
  <div id="screen-home" class="screen active">
    <input class="search" id="home-search" placeholder="חיפוש לקוח" oninput="renderHome()">
    <div class="chips">
      <button type="button" class="on" data-f="open" onclick="setHomeFilter('open')">פתוחות</button>
      <button type="button" data-f="draft" onclick="setHomeFilter('draft')">טיוטה</button>
      <button type="button" data-f="ready" onclick="setHomeFilter('ready')">מוכנה</button>
      <button type="button" data-f="all" onclick="setHomeFilter('all')">הכל</button>
      <button type="button" onclick="load()">רענון</button>
    </div>
    <div id="home-list"><div class="card empty">טוען נתונים...</div></div>
  </div>
  <div id="screen-new" class="screen">
    <div id="step-meta" class="step on">
      <div class="card">
        <label>לקוח</label>
        <input class="search" id="cust-search" placeholder="חפש ובחר לקוח" oninput="filterCustomers()" onfocus="this.select()">
        <div id="cust-results" class="results"></div>
        <label>סוכן</label>
        <select id="agent"></select>
        <label>תאריך אספקה</label>
        <input type="date" id="delivery">
        <div id="date-hint">ברירת מחדל: מחר · אין הזמנות בשישי ושבת</div>
        <label>מי מספק</label>
        <select id="supplier"></select>
      </div>
      <button type="button" class="btn btn-primary" id="next-lines-btn">המשך להזמנה</button>
    </div>
    <div id="step-lines" class="step">
      <div class="card">
        <div id="order-meta-summary" class="picked"></div>
        <label>מוצר</label>
        <input class="search" id="prod-search" placeholder="חפש מוצר" oninput="filterProducts()" onfocus="this.select()">
        <div id="prod-results" class="results"></div>
        <div id="picked-prod-label" class="picked" style="display:none"></div>
        <label>כמות</label>
        <input id="qty" type="number" min="1" value="1">
        <div id="stock-hint" class="fab-note"></div>
        <button type="button" class="btn btn-outline" id="add-line-btn">הוסף שורה</button>
        <div id="lines"></div>
      </div>
      <button type="button" class="btn btn-outline" id="back-meta-btn">חזרה לפרטים</button>
      <button type="button" class="btn btn-primary" id="save-btn">שמור הזמנה</button>
    </div>
  </div>
  <div id="screen-detail" class="screen">
    <div class="card" id="detail"></div>
    <button type="button" class="btn btn-outline" id="edit-btn">עריכת הזמנה</button>
    <button type="button" class="btn btn-primary" onclick="setStatus('מוכנה')">סמן מוכנה</button>
    <button type="button" class="btn btn-accent" onclick="setStatus('סופקה')">סמן סופקה</button>
    <button type="button" class="btn btn-outline" onclick="showScreen('home')">חזרה</button>
  </div>
  <div id="screen-settings" class="screen">
    <div class="chips" id="settings-tabs">
      <button type="button" class="on" data-t="cust" onclick="setSettingsTab('cust')">לקוחות</button>
      <button type="button" data-t="agent" onclick="setSettingsTab('agent')">סוכנים</button>
      <button type="button" data-t="sup" onclick="setSettingsTab('sup')">אספקה</button>
    </div>
    <div id="settings-body"></div>
  </div>
  <div class="toast" id="toast"></div>
  <nav class="nav">
    <button type="button" class="active" data-s="home" onclick="showScreen('home')">ראשי</button>
    <button type="button" data-s="new" onclick="showScreen('new')">הזמנה חדשה</button>
    <button type="button" data-s="settings" onclick="showScreen('settings')">הגדרות</button>
  </nav>
  <script src="config.js?v=34"></script>
  <script src="app.js?v=34"></script>
  <script src="order-flow.js?v=34"></script>
  <script src="settings.js?v=34"></script>
</body>
</html>
